name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile mcp/free-models/server.py

      - name: Unit tests
        run: python -m unittest discover -s mcp/free-models/tests -p "test_*.py" -v

  smoke:
    runs-on: ubuntu-latest
    # Live calls need a key; forks and PRs run without one and skip cleanly.
    env:
      NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live smoke test
        if: env.NIM_API_KEY != ''
        run: bash mcp/free-models/tests/smoke_test.sh
